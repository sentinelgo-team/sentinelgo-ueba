id: "DET-008"
name: "Service Account Interactive Login"
description: "Service accounts should not perform interactive logins."
enabled: true
severity: "high"
confidence: 0.80

mitre:
  technique: "T1078.001"
  tactic: "Persistence"

conditions:
  event_category: "authentication"
  event_outcome: "success"
  user_list:
    - "svc_backup"
    - "svc_deploy"
    - "svc_monitor"
    - "deploy"
    - "daemon"
    - "nobody"
    - "www-data"
    - "postgres"
    - "mysql"
    - "redis"

recommendations:
  - "Investigate why the service account was used interactively."
  - "Service accounts should authenticate only via automated processes."
  - "Review account permissions and recent activity."
  - "Reset credentials if compromise is suspected."
