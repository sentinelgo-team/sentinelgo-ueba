id: "DET-007"
name: "Potential Lateral Movement"
description: "A single user authenticating to multiple distinct hosts within a short period."
enabled: true
severity: "high"
confidence: 0.70

mitre:
  technique: "T1021"
  tactic: "Lateral Movement"

conditions:
  event_category: "authentication"
  event_outcome: "success"
  group_by: "user"
